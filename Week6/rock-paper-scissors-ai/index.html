<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">
    <h1>🪨 Rock Paper Scissors ✂️</h1>

    <p id="turn">Press Start to begin!</p>

    <button id="start-btn">▶️ Start Game</button>
    <button id="restart-btn" hidden>🔄 Restart Game</button>

    <div class="choices">
      <button class="choice-btn" onclick="playGame('rock')" disabled>
        🪨 Rock
      </button>

      <button class="choice-btn" onclick="playGame('paper')" disabled>
        📄 Paper
      </button>

      <button class="choice-btn" onclick="playGame('scissors')" disabled>
        ✂️ Scissors
      </button>
    </div>

    <div class="results">
      <p>You chose: <span id="player-choice">-</span></p>
      <p>Computer chose: <span id="computer-choice">-</span></p>

      <h2 id="result">Start the game!</h2>
    </div>

    <div class="score">
      <p>Player: <span id="player-score">0</span></p>
      <p>Computer: <span id="computer-score">0</span></p>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
